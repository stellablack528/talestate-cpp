name: ci

on:
  push:
  pull_request:

jobs:
  test-runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: runtime
      PYTHONUTF8: "1"
      NO_PROXY: localhost,127.0.0.1,::1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test runtime and example worlds
        run: python -m unittest discover -s tests -v
